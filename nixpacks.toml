[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@10",
  "export PATH=$(npm bin -g):$PATH && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "export PATH=$(npm bin -g):$PATH && pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
