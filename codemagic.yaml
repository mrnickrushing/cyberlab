workflows:

  # ─────────────────────────────────────────────────────────────────
  # Workflow 1: Development / Ad Hoc
  # Triggered manually. Produces a signed IPA — useful if you ever
  # have a Mac (or OTA install tooling) to side-load builds without
  # waiting on TestFlight processing. Auto-triggering is disabled
  # since ios-release now covers every push to main via TestFlight.
  # Uncomment the triggering block below to re-enable it on push.
  # ─────────────────────────────────────────────────────────────────
  ios-dev:
    name: CyberLab iOS — Dev Build (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    integrations:
      app_store_connect: CyberLab ASC Key

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
        # Set in Codemagic UI → App → Environment variables:
        #   DEVELOPMENT_TEAM — your Apple Developer Team ID (e.g. A1B2C3D4E5)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set build number
        script: agvtool new-version -all $BUILD_NUMBER
        working_directory: ios

      - name: Build ad-hoc IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ─────────────────────────────────────────────────────────────────
  # Workflow 2: App Store Release
  # Triggers on every push to main. Builds, signs for App Store
  # distribution, and submits straight to TestFlight — no Mac needed
  # to install builds; just push and check TestFlight on your device.
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: CyberLab iOS — App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    integrations:
      # Add your App Store Connect API key in Codemagic UI →
      # Teams → Integrations → App Store Connect, name it exactly:
      app_store_connect: CyberLab ASC Key

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
      xcode: latest
      cocoapods: default

    scripts:
      - name: Increment build number from TestFlight
        script: |
          # Query highest build number across ALL versions (Apple requires globally unique build numbers)
          LATEST=$(app-store-connect get-latest-build-number "$BUNDLE_ID" 2>/dev/null | tr -d '[:space:]')
          # Fallback to testflight-specific query if the above returns empty
          if [ -z "$LATEST" ] || [ "$LATEST" = "0" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null | tr -d '[:space:]')
          fi
          LATEST=${LATEST:-0}
          # Use a timestamp-based floor to guarantee we never reuse a number
          TS_FLOOR=$(date +%s | tail -c 5)
          if [ "$LATEST" -lt "$TS_FLOOR" ] 2>/dev/null; then
            BUILD_NUMBER=$TS_FLOOR
          else
            BUILD_NUMBER=$(($LATEST + 1))
          fi
          echo "Latest known build: $LATEST, next: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER
        working_directory: ios

      - name: Build App Store IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release || {
            echo "=== XCODEBUILD LOG ==="
            cat /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -E 'error:|warning:|note:|❌|✅|failed|FAILED' | tail -100
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
