workflows:

  # ─────────────────────────────────────────────────────────────────
  # Workflow 1: Development / Ad Hoc
  # Triggers on every push to main.
  # Produces a signed IPA you can install directly on your device.
  # ─────────────────────────────────────────────────────────────────
  ios-dev:
    name: CyberLab iOS — Dev Build (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
        # Set in Codemagic UI → App → Environment variables:
        #   DEVELOPMENT_TEAM — your Apple Developer Team ID (e.g. A1B2C3D4E5)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set build number
        script: agvtool new-version -all $BUILD_NUMBER
        working_directory: ios

      - name: Build ad-hoc IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ─────────────────────────────────────────────────────────────────
  # Workflow 2: App Store Release
  # Triggered manually. Submits to TestFlight automatically.
  # Uncomment the triggering block to also fire on version tags.
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: CyberLab iOS — App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    # Uncomment to trigger on version tags (e.g. v1.2.0):
    # triggering:
    #   events:
    #     - tag
    #   tag_patterns:
    #     - pattern: 'v*'
    #       include: true

    integrations:
      # Add your App Store Connect API key in Codemagic UI →
      # Teams → Integrations → App Store Connect, name it exactly:
      app_store_connect: CyberLab ASC Key

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
        # Set in Codemagic UI → App → Environment variables:
        #   DEVELOPMENT_TEAM — Apple Developer Team ID
      xcode: latest
      cocoapods: default

    scripts:
      - name: Increment build number from TestFlight
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID")
          agvtool new-version -all $(($LATEST_BUILD + 1))
        working_directory: ios

      - name: Build App Store IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
