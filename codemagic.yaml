workflows:

  # ─────────────────────────────────────────────────────────────────
  # Workflow 1: Development / Ad Hoc
  # Triggered manually. Produces a signed IPA — useful if you ever
  # have a Mac (or OTA install tooling) to side-load builds without
  # waiting on TestFlight processing. Auto-triggering is disabled
  # since ios-release now covers every push to main via TestFlight.
  # Uncomment the triggering block below to re-enable it on push.
  # ─────────────────────────────────────────────────────────────────
  ios-dev:
    name: CyberLab iOS — Dev Build (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    integrations:
      app_store_connect: CyberLab ASC Key

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
        # Set in Codemagic UI → App → Environment variables:
        #   DEVELOPMENT_TEAM — your Apple Developer Team ID (e.g. A1B2C3D4E5)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set build number
        script: agvtool new-version -all $BUILD_NUMBER
        working_directory: ios

      - name: Build ad-hoc IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ─────────────────────────────────────────────────────────────────
  # Workflow 2: App Store Release
  # Triggers on every push to main. Builds, signs for App Store
  # distribution, and submits straight to TestFlight — no Mac needed
  # to install builds; just push and check TestFlight on your device.
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: CyberLab iOS — App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    integrations:
      # Add your App Store Connect API key in Codemagic UI →
      # Teams → Integrations → App Store Connect, name it exactly:
      app_store_connect: CyberLab ASC Key

    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cyberlabmobile.app
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlabmobile.app
      xcode: latest
      cocoapods: default

    scripts:
      - name: Increment build number from TestFlight
        script: |
          LATEST_ASC=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null | tr -d '[:space:]' || echo "0")
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null | tr -d '[:space:]' || echo "0")
          LATEST_ASC=${LATEST_ASC:-0}
          LATEST_TF=${LATEST_TF:-0}
          # Use whichever is higher
          if [ "$LATEST_ASC" -gt "$LATEST_TF" ] 2>/dev/null; then
            LATEST_BUILD=$LATEST_ASC
          else
            LATEST_BUILD=$LATEST_TF
          fi
          NEXT_BUILD=$(($LATEST_BUILD + 1))
          # Floor at 5 — builds 1-4 already consumed by ASC
          if [ $NEXT_BUILD -le 7 ]; then NEXT_BUILD=7; fi
          echo "Latest ASC: $LATEST_ASC, Latest TF: $LATEST_TF, Next: $NEXT_BUILD"
          agvtool new-version -all $NEXT_BUILD
        working_directory: ios

      - name: Build App Store IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release || {
            echo "=== XCODEBUILD LOG ==="
            cat /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -E 'error:|warning:|note:|❌|✅|failed|FAILED' | tail -100
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
