workflows:

  # ─────────────────────────────────────────────────────────────────
  # Workflow 1: Development / Ad Hoc
  # Triggers on every push to main.
  # Produces a signed IPA distributed via email for device testing.
  # ─────────────────────────────────────────────────────────────────
  ios-dev:
    name: CyberLab iOS — Dev Build (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.cyberlab.mobile
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlab.mobile
        # Set these in the Codemagic UI → Environment variables:
        #   DEVELOPMENT_TEAM   — your Apple Developer Team ID (e.g. A1B2C3D4E5)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set build number to Codemagic build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
        working_directory: ios

      - name: Build ad-hoc IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
        working_directory: .

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - $CM_SUBMITTER_EMAIL
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────
  # Workflow 2: App Store Release
  # Triggered manually (or add a tag pattern below).
  # Archives, exports, and submits to TestFlight automatically.
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: CyberLab iOS — App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    # Remove the comment below to also trigger on version tags (e.g. v1.2.0):
    # triggering:
    #   events:
    #     - tag
    #   tag_patterns:
    #     - pattern: 'v*'
    #       include: true

    integrations:
      # Create an App Store Connect API key in the Codemagic UI under
      # Teams → Integrations → App Store Connect, then reference it here.
      app_store_connect: CyberLab ASC Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cyberlab.mobile
      vars:
        XCODE_PROJECT: ios/CyberLabMobile.xcodeproj
        XCODE_SCHEME: CyberLabMobile
        BUNDLE_ID: com.cyberlab.mobile
        # Set these in the Codemagic UI → Environment variables:
        #   DEVELOPMENT_TEAM       — Apple Developer Team ID
        #   APP_STORE_CONNECT_ISSUER_ID       — ASC API key issuer ID
        #   APP_STORE_CONNECT_KEY_IDENTIFIER  — ASC API key ID
        #   APP_STORE_CONNECT_PRIVATE_KEY     — ASC API private key (.p8 contents)
      xcode: latest
      cocoapods: default

    scripts:
      - name: Increment build number
        script: |
          # Fetches the latest TestFlight build number and increments it.
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID")
          agvtool new-version -all $(($LATEST_BUILD + 1))
        working_directory: ios

      - name: Build App Store IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
        working_directory: .

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Submits the build to TestFlight immediately after upload.
        submit_to_testflight: true
        # Change to true when you're ready to push directly to App Review.
        submit_to_app_store: false

      email:
        recipients:
          - $CM_SUBMITTER_EMAIL
        notify:
          success: true
          failure: true
